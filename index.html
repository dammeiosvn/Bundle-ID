<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bundle ID">
<meta name="theme-color" content="#5C5C5C">
<meta name="format-detection" content="telephone=no">
<meta name="apple-touch-fullscreen" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Bundle ID</title>
<style>
  :root {
    --bg: #5C5C5C;
    --hi: rgba(255,255,255,.22);
    --lo: rgba(0,0,0,.48);
    --ink: #F4F4F2;
    --mute: rgba(244,244,242,.62);
    --line: rgba(255,255,255,.16);
    --safe-t: env(safe-area-inset-top);
    --safe-b: env(safe-area-inset-bottom);
    --safe-l: env(safe-area-inset-left);
    --safe-r: env(safe-area-inset-right);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100dvh;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  .app {
    min-height: 100dvh;
    display: flex; flex-direction: column;
    padding:
      calc(14px + var(--safe-t))
      calc(16px + var(--safe-r))
      calc(18px + var(--safe-b))
      calc(16px + var(--safe-l));
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .mark { font-size: 22px; font-weight: 650; letter-spacing: -.03em; }
  .mark span { font-weight: 450; opacity: .7; }
  .hint { font-size: 12px; color: var(--mute); }

  .search-row { display: flex; gap: 12px; align-items: stretch; }
  .field, .store, .card, .chip {
    background: #5C5C5C;
    border: 1px solid var(--line);
    box-shadow:
      inset 1px 1px 0 rgba(255,255,255,.2),
      -6px -6px 14px var(--hi),
      7px 8px 16px var(--lo);
  }
  .field {
    flex: 1; display: flex; align-items: center; gap: 8px;
    height: 52px; border-radius: 18px; padding: 0 14px;
  }
  .field svg { flex: none; opacity: .7; }
  input {
    flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: 16px/1.2 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    min-width: 0;
  }
  input::placeholder { color: rgba(244,244,242,.42); }
  .store {
    width: 64px; height: 52px; border-radius: 18px; color: var(--ink);
    font: 650 15px/1 -apple-system, system-ui, sans-serif; letter-spacing: .04em;
    cursor: pointer;
  }
  .store:active, .card:active, .chip:active {
    box-shadow:
      inset 4px 4px 8px rgba(0,0,0,.35),
      inset -3px -3px 7px rgba(255,255,255,.12);
    transform: translateY(1px);
  }
  .list {
    margin-top: 18px; display: flex; flex-direction: column; gap: 12px;
    flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
    padding: 4px 2px 8px;
  }
  .card {
    display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center;
    padding: 12px; border-radius: 22px; text-decoration: none; color: inherit;
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    background: rgba(92,92,92,.72);
    animation: rise .46s cubic-bezier(.2,.7,.2,1) both;
    animation-delay: calc(var(--i) * 70ms);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(-18px); filter: blur(8px); }
    to { opacity: 1; transform: none; filter: none; }
  }
  .icon {
    width: 58px; height: 58px; border-radius: 14px; object-fit: cover;
    box-shadow: 0 6px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
    background: #4a4a4a;
  }
  .name { font-size: 16px; font-weight: 620; letter-spacing: -.02em; line-height: 1.2; }
  .seller { margin-top: 2px; font-size: 12px; color: var(--mute); }
  .bid {
    margin-top: 6px; display: flex; align-items: center; gap: 8px;
    font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #F7F7F5; word-break: break-all;
  }
  .copy {
    flex: none; border: 0; color: var(--ink); background: #5C5C5C;
    width: 28px; height: 28px; border-radius: 9px; padding: 0;
    box-shadow: -3px -3px 6px rgba(255,255,255,.16), 3px 4px 7px rgba(0,0,0,.4);
  }
  .empty, .err {
    margin: auto; text-align: center; color: var(--mute); font-size: 14px; padding: 28px 12px;
  }
  .sheet {
    position: fixed; inset: 0; background: rgba(0,0,0,.28);
    display: none; align-items: flex-end; z-index: 5;
  }
  .sheet.on { display: flex; }
  .panel {
    width: 100%; max-height: 70dvh; overflow: auto;
    background: rgba(92,92,92,.86);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 28px 28px 0 0;
    border: 1px solid var(--line);
    box-shadow: 0 -10px 30px rgba(0,0,0,.35);
    padding: 14px 16px calc(18px + var(--safe-b));
  }
  .panel h2 { margin: 4px 0 12px; font-size: 16px; font-weight: 620; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .chip {
    height: 44px; border-radius: 14px; color: var(--ink);
    font: 640 13px/1 -apple-system, system-ui, sans-serif;
  }
  .chip.on { outline: 1px solid rgba(255,255,255,.45); }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + var(--safe-b));
    transform: translateX(-50%) translateY(8px); opacity: 0;
    background: #2c2c2c; color: #fff; border-radius: 999px;
    padding: 8px 14px; font-size: 13px; pointer-events: none;
    transition: .25s ease;
  }
  .toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="mark">Bundle <span>ID</span></div>
      <div class="hint">iTunes · 10 app</div>
    </header>
    <div class="search-row">
      <label class="field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="Tên ứng dụng" autocomplete="off" enterkeyhint="search">
      </label>
      <button class="store" id="storeBtn" type="button" aria-label="Store">VN</button>
    </div>
    <div class="list" id="list">
      <div class="empty">Nhập tên để lấy bundle id.</div>
    </div>
  </div>
  <div class="sheet" id="sheet">
    <div class="panel">
      <h2>Store</h2>
      <div class="grid" id="grid"></div>
    </div>
  </div>
  <div class="toast" id="toast">Đã chép bundle id</div>
<script>
const STORES = ["VN","US","UK","JP","KR","CN","TW","HK","SG","TH","AU","CA","DE","FR","IT","ES","IN","BR","ID","NL"];
const iso = c => c === "UK" ? "gb" : c.toLowerCase();
let store = localStorage.getItem("bid.store") || "VN";
let timer, seq = 0;
const q = document.getElementById("q");
const list = document.getElementById("list");
const storeBtn = document.getElementById("storeBtn");
const sheet = document.getElementById("sheet");
const grid = document.getElementById("grid");
storeBtn.textContent = store;

STORES.forEach(code => {
  const b = document.createElement("button");
  b.className = "chip" + (code === store ? " on" : "");
  b.textContent = code;
  b.onclick = () => {
    store = code;
    localStorage.setItem("bid.store", code);
    storeBtn.textContent = code;
    sheet.classList.remove("on");
    if (q.value.trim()) run();
  };
  grid.appendChild(b);
});
storeBtn.onclick = () => sheet.classList.add("on");
sheet.onclick = e => { if (e.target === sheet) sheet.classList.remove("on"); };

q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 320); });
q.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); run(); } });

function art(u) {
  return u ? u.replace(/\/\d+x\d+bb\.(jpg|png)/, "/512x512bb.$1") : "";
}
function toast(t) {
  const el = document.getElementById("toast");
  el.textContent = t;
  el.classList.add("on");
  setTimeout(() => el.classList.remove("on"), 1200);
}
async function lookup(term) {
  const url = "https://itunes.apple.com/search?term=" + encodeURIComponent(term)
    + "&country=" + iso(store) + "&media=software&entity=software&limit=10";
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error("http");
    return await r.json();
  } catch {
    return await new Promise((ok, bad) => {
      const cb = "it_" + Date.now();
      const s = document.createElement("script");
      const done = () => { delete window[cb]; s.remove(); };
      window[cb] = d => { done(); ok(d); };
      s.onerror = () => { done(); bad(); };
      s.src = url + "&callback=" + cb;
      document.head.appendChild(s);
    });
  }
}
async function run() {
  const term = q.value.trim();
  const id = ++seq;
  if (!term) { list.innerHTML = '<div class="empty">Nhập tên để lấy bundle id.</div>'; return; }
  list.innerHTML = '<div class="empty">Đang tìm…</div>';
  try {
    const data = await lookup(term);
    if (id !== seq) return;
    const apps = (data.results || []).filter(a => a.bundleId).slice(0, 10);
    if (!apps.length) { list.innerHTML = '<div class="empty">Không có app trên store ' + store + '.</div>'; return; }
    list.innerHTML = "";
    apps.forEach((a, i) => {
      const el = document.createElement("a");
      el.className = "card";
      el.style.setProperty("--i", i);
      el.href = a.trackViewUrl || ("https://apps.apple.com/" + iso(store) + "/app/id" + a.trackId);
      el.innerHTML =
        '<img class="icon" alt="" src="' + art(a.artworkUrl100 || a.artworkUrl512) + '">' +
        '<div><div class="name"></div><div class="seller"></div><div class="bid"><span></span>' +
        '<button class="copy" type="button" aria-label="Chép">⎘</button></div></div>';
      el.querySelector(".name").textContent = a.trackName || "";
      el.querySelector(".seller").textContent = a.sellerName || a.artistName || "";
      el.querySelector(".bid span").textContent = a.bundleId;
      el.addEventListener("click", ev => {
        if (ev.target.closest(".copy")) return;
        ev.preventDefault();
        location.href = "itms-apps://apps.apple.com/app/id" + a.trackId;
      });
      el.querySelector(".copy").onclick = ev => {
        ev.preventDefault(); ev.stopPropagation();
        navigator.clipboard.writeText(a.bundleId).then(() => toast("Đã chép " + a.bundleId)).catch(() => toast(a.bundleId));
      };
      list.appendChild(el);
    });
  } catch {
    if (id === seq) list.innerHTML = '<div class="err">Không gọi được iTunes. Thử lại.</div>';
  }
}
</script>
</body>
</html>
